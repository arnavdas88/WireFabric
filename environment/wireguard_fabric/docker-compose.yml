  #     dockerfile: Dockerfile
  #   entrypoint: []
  #   ports:
  #     - 8000:8000
  #   cap_add:
  #     - NET_ADMIN
  #     - SYS_MODULE
  #   networks:
  #     - internet

networks:
  internet:
    ipam:
      driver: default
      config:
        - subnet: 172.30.30.0/24
          gateway: 172.30.30.1